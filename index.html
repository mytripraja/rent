<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172033" />
    <meta name="description" content="Rental Manager — a private property-management workspace for owners, co-owners and tenants." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Rental Manager" />
    <meta property="og:description" content="Your property. One clear ledger." />
    <meta property="og:type" content="website" />
    <title>Rental Manager — Property workspace</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
  <body>
    <div id="root">
      <main id="rm-startup-fallback" role="status" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f5;color:#172033;font-family:system-ui,sans-serif">
        <section style="max-width:420px;text-align:center;background:white;border:1px solid #dfe5e2;border-radius:16px;padding:24px;box-shadow:0 12px 36px #17203312">
          <strong style="font-size:18px">Rental Manager</strong>
          <p style="color:#64748b">Loading your workspace…</p>
          <p id="rm-startup-message" style="font-size:13px;color:#64748b">Please wait a moment.</p>
          <button id="rm-startup-retry" type="button" style="display:none;border:0;border-radius:10px;background:#0f766e;color:white;padding:10px 16px;font:inherit">Reload app</button>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root')
        var message = document.getElementById('rm-startup-message')
        var retry = document.getElementById('rm-startup-retry')
        var failed = false
        function showFailure(reason) {
          if (failed || !root || root.children.length > 1) return
          failed = true
          if (message) message.textContent = reason || 'The app did not finish loading. Check your connection and reload.'
          if (retry) { retry.style.display = 'inline-block'; retry.onclick = function () { window.location.reload() } }
        }
        window.setTimeout(function () {
          if (root && root.querySelector('#rm-startup-fallback')) showFailure('The app is taking longer than expected. Reload the page. If this continues, clear this site’s cached data and try again.')
        }, 12000)
        window.addEventListener('error', function (event) {
          if (event && event.target && event.target.tagName === 'SCRIPT') showFailure('A required app file could not load. Reload the page; if it continues, contact the administrator.')
        }, true)
        window.addEventListener('unhandledrejection', function () {
          // Runtime errors are also captured by the app error boundary when React has mounted.
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
