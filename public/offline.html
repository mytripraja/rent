<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><title>Rental Manager — Offline</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7f6;color:#18212f;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border:1px solid #e4e8e5;border-radius:26px;padding:28px;box-shadow:0 16px 50px #17203318;text-align:center}.logo{width:54px;height:54px;border-radius:16px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin:0 auto 12px}.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#667085;font-weight:800}.title{font-size:30px;font-weight:850;margin:5px 0}.copy{color:#667085;line-height:1.6;font-size:14px}.game{margin-top:20px;position:relative;height:170px;border-radius:18px;background:#172033;overflow:hidden;border:1px solid #26364d}.ground{position:absolute;left:0;right:0;bottom:25px;height:3px;background:#2aa897}.player{position:absolute;left:54px;bottom:28px;width:28px;height:28px;border-radius:7px;background:#f2c878}.obstacle{position:absolute;right:-30px;bottom:28px;width:20px;height:34px;border-radius:5px;background:#d14b4b}.score{position:absolute;top:12px;right:14px;color:#fff;font:600 12px ui-monospace}.hint{margin-top:12px;font-size:12px;color:#667085}.btn{margin-top:16px;border:0;border-radius:12px;background:#0f766e;color:#fff;padding:11px 16px;font-weight:800}.jump{animation:jump .48s ease}@keyframes jump{50%{transform:translateY(-78px)}}
</style></head><body><section class="card"><div class="logo">RM</div><div class="kicker">No network</div><h1 class="title">You're offline</h1><p class="copy">Rental Manager cannot reach the network right now. Your local app shell is still available. Play a tiny offline game while you reconnect.</p><div class="game" id="game" tabindex="0" aria-label="Offline jump game. Press Space or tap Jump to jump over obstacles."><div class="score" id="score">0</div><div class="player" id="player"></div><div class="obstacle" id="obstacle"></div><div class="ground"></div></div><button class="btn" id="jump">Jump</button><div class="hint">Space / ↑ / tap Jump</div><button class="btn" onclick="location.reload()">Try Rental Manager again</button></section><script>
const p=document.getElementById('player'),o=document.getElementById('obstacle'),s=document.getElementById('score');let jumping=false,score=0,dead=false;function jump(){if(jumping||dead)return;jumping=true;p.classList.add('jump');setTimeout(()=>{p.classList.remove('jump');jumping=false},480)}document.getElementById('jump').onclick=jump;document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});let x=0;setInterval(()=>{if(dead)return;x+=7;if(x>620)x=-30;o.style.right=x+'px';const pr=p.getBoundingClientRect(),ob=o.getBoundingClientRect();if(!jumping&&pr.right>ob.left+4&&pr.left<ob.right-4&&pr.bottom>ob.top+5){dead=true;s.textContent='Game over';}if(!dead){score++;s.textContent=score}},80);
</script></body></html>
